name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    # Prevents changesets action from creating a PR on forks
    if: github.repository == 'ing-bank/lion'
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: lion-npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          # The staging script compares package versions with the push's previous commit.
          fetch-depth: 0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install --ci

      - name: Create Release Pull Request or Stage packages on npm
        id: changesets
        uses: changesets/action@v1
        with:
          create-github-releases: false
          push-git-tags: false
          # Keeps Changesets' version PR flow; the release script stages versions without tagging them as published.
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NEW_NPM_TOKEN_TEST }}

name: Verify changes

on: pull_request

jobs:
  verify:
    name: Verify changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Sanity check
        run: node ./scripts/lock-scan.mjs

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # pnpm-lock.yaml is gitignored: it is derived from the committed package-lock.json, which stays the
      # lock external tooling reads (packages-node/lockfile-interop). `pnpm import` derives it, the frozen
      # install then proves the derived lock is complete.
      - name: Derive the pnpm lock
        run: pnpm import

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Fails when a workspace manifest declares a dependency that pnpm would install at a version the
      # committed package-lock.json does not record (declared mode + --require; the gate explains itself in
      # packages-node/lockfile-interop). Runs after the install: the check imports `yaml`.
      - name: Lockfile consistency
        run: pnpm run repo:lockfile:check

      # pnpm-workspace.yaml is derived from package.json (members + overrides); this fails when the committed
      # file is not what package.json implies
      - name: pnpm-workspace.yaml is in sync
        run: pnpm run repo:workspace:check
          npm run lint:workspace-lists

      - name: Lint
        run: pnpm run lint

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # pnpm-lock.yaml is gitignored: it is derived from the committed package-lock.json, which stays the
      # lock external tooling reads (packages-node/lockfile-interop). `pnpm import` derives it, the frozen
      # install then proves the derived lock is complete.
      - name: Derive the pnpm lock
        run: pnpm import

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright
        run: pnpm exec playwright install --with-deps

      - name: Test
        run: pnpm run test:browser

  browser-tests-safari16:
    name: Browser tests (Safari 16)
    # The job above runs whatever Playwright currently ships - WebKit 26 at the time of writing. This
    # one gates the oldest WebKit we can reasonably claim: Safari 16, which is WebKit 16.4 in
    # Playwright 1.35.1. That version's dependency list predates Ubuntu 24.04 (`libasound2`, `libffi7`
    # and `libx264-163` were renamed or replaced there, so `--with-deps` cannot install), hence 22.04 -
    # a runner Playwright 1.35 supports.
    #
    # It gates the PR: the suite holds on WebKit 16.4 except for one measured test of OverlayController
    # (focus while tabbing), which skips itself on Safari through Lion's own core browser detection.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Pin Playwright to the Safari 16 generation
        # The repository keeps Playwright current for the modern matrix; this job replaces it in the working
        # tree only (pnpm writes pnpm-lock.yaml, never the committed package-lock.json), so nothing else moves
        # back to 2023. The CLI is called through its own `cli.js` because `pnpm exec playwright` can resolve
        # a different binary.
        run: |
          pnpm add -w --save-dev --ignore-workspace-root-check playwright@1.35.1
          node node_modules/playwright/cli.js --version

      - name: Playwright (webkit 16.4)
        run: node node_modules/playwright/cli.js install --with-deps webkit

      - name: Test (WebKit only)
        run: pnpm exec web-test-runner --config web-test-runner-webkit.config.mjs

  node-tests:
    name: Node tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # pnpm-lock.yaml is derived from the committed package-lock.json (see the verify job).
      - name: Derive the pnpm lock
        run: pnpm import

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test:node

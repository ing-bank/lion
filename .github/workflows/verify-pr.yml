name: Verify changes

on: pull_request

jobs:
  verify:
    name: Verify changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Sanity check
        run: node ./scripts/lock-scan.mjs

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # pnpm-workspace.yaml is generated from package.json (members + overrides in pnpm's spelling), so a
      # local pnpm install resolves what this npm install resolves. Fails when the committed file is stale.
      - name: pnpm-workspace.yaml is in sync
        run: npm run repo:workspace:check

      - name: Workspace lists are in sync
        run: npm run lint:workspace-lists

      # Resolves the pnpm lock a developer gets locally (lock only, nothing installed; .pnpmfile.cjs pins
      # every range to what package-lock.json installs) and fails when a declared dependency would still
      # resolve to a different version - e.g. package.json changed without regenerating package-lock.json.
      - name: Lockfile consistency
        run: |
          npx --yes pnpm@10.34.9 install --lockfile-only
          npm run repo:lockfile:check

      - name: Lint
        run: npm run lint

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Playwright
        run: npx playwright install --with-deps

      - name: Test
        run: npm run test:browser

  browser-tests-safari16:
    name: Browser tests (Safari 16)
    # The job above runs whatever Playwright currently ships - WebKit 26 at the time of writing. This
    # one gates the oldest WebKit we can reasonably claim: Safari 16, which is WebKit 16.4 in
    # Playwright 1.35.1. That version's dependency list predates Ubuntu 24.04 (`libasound2`, `libffi7`
    # and `libx264-163` were renamed or replaced there, so `--with-deps` cannot install), hence 22.04 -
    # a runner Playwright 1.35 supports.
    #
    # It gates the PR: the suite holds on WebKit 16.4 except for one measured test of OverlayController
    # (focus while tabbing), which skips itself on Safari through Lion's own core browser detection.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Pin Playwright to the Safari 16 generation
        # `--no-save --force`: the repository keeps Playwright current for the modern matrix, this job
        # replaces it in the working tree only, so nothing else moves back to 2023. The CLI is called
        # through its own `cli.js` because `npx playwright` can resolve a different binary.
        run: |
          npm install --no-save --force --no-audit --no-fund playwright@1.35.1
          node node_modules/playwright/cli.js --version

      - name: Playwright (webkit 16.4)
        run: node node_modules/playwright/cli.js install --with-deps webkit

      - name: Test (WebKit only)
        run: npx web-test-runner --config web-test-runner-webkit.config.mjs

  node-tests:
    name: Node tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --force

      - name: Test
        run: npm run test:node

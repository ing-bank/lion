name: Verify changes

on: pull_request

jobs:
  verify:
    name: Verify changes
    runs-on: ubuntu-latest
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Sanity check
        run: node ./scripts/lock-scan.mjs

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm install --ci

      # Fails when package-lock.json resolves different versions than pnpm-lock.yaml, so tooling that
      # reads the npm lock cannot derive versions the install does not have. No-op while the repo has no
      # pnpm lock; a hard gate as soon as one is committed. Runs after the install: the check needs the
      # workspace dependencies.
      - name: Lockfile consistency
        run: npm run repo:lockfile:check

      - name: Lint
        run: npm run lint

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install Dependencies
        run: npm install --ci

      - name: Playwright
        run: npx playwright install --with-deps

      - name: Test
        run: npm run test:browser

  node-tests:
    name: Node tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm install --ci --force

      - name: Test
        run: npm run test:node

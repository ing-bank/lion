name: SR automation

on:
  push:
    paths:
      - 'packages/ui/components/**/test/*.sr.test.mjs'
      - 'packages-node/test-runner-screenreader/**'
      - 'web-test-runner-sr.config.mjs'
      - '.github/workflows/guidepup.yml'
  workflow_dispatch:

jobs:
  voiceover:
    name: VoiceOver (macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # guidepup/setup-action is no longer supported ("use the @guidepup/setup
      # CLI directly"). `setup` configures the machine, `install` adds the screen
      # reader assets that belong to this project's guidepup version - both are
      # needed, and the assets step has to run after the project is installed.
      - name: Setup screen reader environment
        run: npx @guidepup/setup setup --ci

      - name: Install dependencies
        run: npm ci

      - name: Install screen reader assets
        run: npx @guidepup/setup install

      - name: Playwright
        run: npx playwright install --with-deps

      - name: Run screen reader tests
        run: npm run test:sr -- --voiceover

  nvda:
    name: NVDA (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup screen reader environment
        run: npx @guidepup/setup setup --ci

      - name: Install dependencies
        run: npm ci

      - name: Install screen reader assets
        run: npx @guidepup/setup install

      - name: Playwright
        run: npx playwright install --with-deps

      - name: Run screen reader tests
        run: npm run test:sr -- --nvda

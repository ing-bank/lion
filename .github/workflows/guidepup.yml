name: SR automation

on:
  push:
    paths:
      - 'packages/ui/components/**/test/*.sr.test.js'
      - 'packages-node/test-runner-sr/**'
      - 'web-test-runner-sr.config.mjs'
      - '.github/workflows/guidepup.yml'
  workflow_dispatch:

jobs:

# The change graph answers which screen reader tests this branch can affect. The reader jobs only

# start when there is something to run, so a change that cannot touch a component test does not

# cost a macOS or Windows runner at all

  select:
    name: Which screen reader tests are affected
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.affected.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Derive the pnpm lock
        run: pnpm import

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the affected screen reader tests
        id: affected
        run: |
          set -o pipefail
          git fetch --no-tags origin master
          # A crashing selection must fail this job, never end up as "nothing to run".
          selected="$(node packages-node/change-graph/src/cli.js --mode=pr --base=origin/master --include-sr --format=args \
            | tr ' ' '\n' | grep '\.sr\.test\.js$' || true)"
          # One `--files` per path: the runner takes a single pattern per flag, so a
          # space-separated list would be one pattern that matches nothing.
          args=""
          for file in $selected; do args="$args --files $file"; done
          echo "files=${args}" >> "$GITHUB_OUTPUT"
          echo "affected: ${selected:-none}"

  voiceover:
    name: VoiceOver (macos)
    needs: select
    if: needs.select.outputs.files != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # guidepup/setup-action is no longer supported ("use the @guidepup/setup
      # CLI directly"). `setup` configures the machine, `install` adds the screen
      # reader assets that belong to this project's guidepup version - both are
      # needed, and the assets step has to run after the project is installed.
      # A one-off fetch of the screen-reader driver, not an install of this repo: kept on npx because its
      # flags (`--min-release-age=0 --ignore-scripts=false`) are npx's, and the driver's own installer has to
      # run. Everything this repository installs goes through pnpm (see the Derive/Install steps above).
      - name: Setup screen reader environment
        run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci

      - name: Derive the pnpm lock
        run: pnpm import

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install screen reader assets
        run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install

      - name: Playwright
        run: pnpm exec playwright install --with-deps

      - name: Run screen reader tests
        shell: bash
        run: |
          set -u
          log="$RUNNER_TEMP/sr-voiceover.log"
          failures=""
          # The reader is a process on a runner we do not control: it can refuse to start, or start and stop
          # answering mid-run. Neither is a defect in the component, so a file that fails is retried once -
          # but only when the log shows the reader misbehaved. A real expectation failure fails again on that
          # retry, so this never hides one; it only stops a dead screen reader from colouring a green suite red.
          for file in $(echo "${{ needs.select.outputs.files }}" | tr ' ' '\n' | grep -v '^--files$' | grep -v '^$'); do
            status="pass"
            for attempt in 1 2; do
              if pnpm run test:sr -- --voiceover --files "$file" >"$log" 2>&1; then
                break
              fi
              if [ "$attempt" = 2 ] || ! grep -qE "cannot be started|Unable to activate|is not running|did not answer after starting|\[sr-recover\]" "$log"; then
                status="FAIL"
                break
              fi
              status="passed after retry (the reader misbehaved)"
              echo "::warning file=$file::the screen reader misbehaved; retrying this file once"
              sleep 15
            done
            echo "- \`$file\`: $status" >> "$GITHUB_STEP_SUMMARY"
            grep -E "test files \||Error:" "$log" | tail -2
            if [ "$status" = "FAIL" ]; then failures="$failures $file"; fi
          done
          if [ -n "$failures" ]; then
            echo "::error::screen reader tests still failing after a retry:$failures"
            exit 1
          fi

  nvda:
    name: NVDA (windows)
    needs: select
    if: needs.select.outputs.files != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # A one-off fetch of the screen-reader driver, not an install of this repo: kept on npx because its
      # flags (`--min-release-age=0 --ignore-scripts=false`) are npx's, and the driver's own installer has to
      # run. Everything this repository installs goes through pnpm (see the Derive/Install steps above).
      - name: Setup screen reader environment
        run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci

      - name: Derive the pnpm lock
        run: pnpm import

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install screen reader assets
        run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install

      - name: Playwright
        run: pnpm exec playwright install --with-deps

      - name: Run screen reader tests
        shell: bash
        run: |
          set -u
          log="$RUNNER_TEMP/sr-nvda.log"
          failures=""
          # The reader is a process on a runner we do not control: it can refuse to start, or start and stop
          # answering mid-run. Neither is a defect in the component, so a file that fails is retried once -
          # but only when the log shows the reader misbehaved. A real expectation failure fails again on that
          # retry, so this never hides one; it only stops a dead screen reader from colouring a green suite red.
          for file in $(echo "${{ needs.select.outputs.files }}" | tr ' ' '\n' | grep -v '^--files$' | grep -v '^$'); do
            status="pass"
            for attempt in 1 2; do
              if pnpm run test:sr -- --nvda --files "$file" >"$log" 2>&1; then
                break
              fi
              if [ "$attempt" = 2 ] || ! grep -qE "cannot be started|Unable to activate|is not running|did not answer after starting|\[sr-recover\]" "$log"; then
                status="FAIL"
                break
              fi
              status="passed after retry (the reader misbehaved)"
              echo "::warning file=$file::the screen reader misbehaved; retrying this file once"
              sleep 15
            done
            echo "- \`$file\`: $status" >> "$GITHUB_STEP_SUMMARY"
            grep -E "test files \||Error:" "$log" | tail -2
            if [ "$status" = "FAIL" ]; then failures="$failures $file"; fi
          done
          if [ -n "$failures" ]; then
            echo "::error::screen reader tests still failing after a retry:$failures"
            exit 1
          fi

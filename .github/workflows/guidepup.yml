name: SR automation

on:
  push:
    paths:
      - 'packages/ui/components/**/test/*.sr.test.mjs'
      - 'packages-node/test-runner-screenreader/**'
      - 'web-test-runner-sr.config.mjs'
      - '.github/workflows/guidepup.yml'
  workflow_dispatch:

jobs:
  voiceover:
    name: VoiceOver (macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup screen reader
        uses: guidepup/setup-action@main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Playwright
        run: npx playwright install --with-deps

      - name: Run screen reader tests
        run: npm run test:sr -- --voiceover

  nvda:
    name: NVDA (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup screen reader
        uses: guidepup/setup-action@main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Playwright
        run: npx playwright install --with-deps

      - name: Run screen reader tests
        run: npm run test:sr -- --nvda
